name: smart_plant_monitor
description: A Smart Plant Monitoring System that connects to an ESP32 via Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_database: ^11.1.0

  # UI & Design
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
